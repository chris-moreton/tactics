<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchday Plan — Challenger Team vs Defending Champions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --card: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-dark: #059669;
      --gold: #fbbf24;
      --col-gk: #f59e0b;
      --col-cb: #3b82f6;
      --col-fb: #06b6d4;
      --col-cdm: #6366f1;
      --col-m: #8b5cf6;
      --col-wg: #ec4899;
      --col-st: #ef4444;
      --col-bench: #334155;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Hints */
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .hint-arrow {
      color: var(--accent);
      font-size: 1.1rem;
      flex-shrink: 0;
      animation: bounce-down 1.5s ease-in-out infinite;
    }
    @keyframes bounce-down {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    .hint-scrubber {
      margin-bottom: 4px;
    }
    .hint-pitch {
      margin-bottom: 12px;
    }

    /* Time Scrubber */
    .scrubber {
      padding: 12px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .scrubber-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .scrubber-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      min-height: 56px;
    }
    .scrubber-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .scrubber-btn .time-label {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .scrubber-btn .sub-label {
      font-size: 0.7rem;
      margin-top: 2px;
      opacity: 0.7;
    }
    .scrubber-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    }
    .scrubber-btn.active .sub-label { opacity: 1; }

    /* Main content */
    .main { padding: 16px 0; }
    @media (min-width: 768px) {
      .main-grid {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 24px;
        align-items: start;
      }
    }

    /* Bench */
    .bench-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .bench-bar:hover { border-color: var(--col-bench); }
    .bench-bar.selected { border-color: var(--gold); }
    .bench-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .bench-player-name {
      font-weight: 700;
      color: var(--text);
      font-size: 0.95rem;
    }
    .bench-dot {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--col-bench);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
    }

    /* Pitch */
    .pitch-wrapper {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
    }
    .pitch-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      overflow: visible;
    }

    /* Opposition toggle button */
    .opp-btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: 1px solid #f97316;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      text-align: center;
    }
    .opp-btn:hover { filter: brightness(1.1); }
    .opp-btn.active {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      border-color: #ea580c;
    }

    /* Grid toggle button */
    .grid-btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: 1px solid #8b5cf6;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      text-align: center;
    }
    .grid-btn:hover { filter: brightness(1.1); }
    .grid-btn.active {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      border-color: #7c3aed;
    }

    /* Position/time grid */
    .pos-grid {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 12px;
      overflow-x: auto;
    }
    .pos-grid table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .pos-grid th, .pos-grid td {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .pos-grid th {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pos-grid th.row-header {
      text-align: left;
      padding-left: 10px;
      min-width: 60px;
    }
    .pos-grid td.filled {
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      border-radius: 0;
    }
    .pos-grid td.empty {
      color: var(--border);
    }

    /* Player Detail */
    .player-detail {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }
    .player-detail.empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 24px;
      font-size: 0.95rem;
    }
    .player-name-big {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .player-role {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }
    .journey-bar { margin-top: 20px; }
    .journey-bar-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .journey-segments {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      border-radius: 8px;
      overflow: hidden;
    }
    .journey-seg {
      padding: 8px 2px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .journey-seg:hover { filter: brightness(1.25); }
    .journey-seg.active { outline: 2px solid var(--gold); outline-offset: -2px; }
    .journey-seg.type-gk { background: var(--col-gk); }
    .journey-seg.type-cb { background: var(--col-cb); }
    .journey-seg.type-fb { background: var(--col-fb); }
    .journey-seg.type-cdm { background: var(--col-cdm); }
    .journey-seg.type-m { background: var(--col-m); }
    .journey-seg.type-wg { background: var(--col-wg); }
    .journey-seg.type-st { background: var(--col-st); }
    .journey-seg.type-bench { background: var(--col-bench); }
    .journey-labels {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      margin-top: 4px;
    }
    .journey-labels span {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-muted);
    }
    .player-blurb {
      margin-top: 20px;
      padding: 16px;
      border-left: 3px solid var(--accent);
      background: rgba(16,185,129,0.05);
      border-radius: 0 8px 8px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* Player token */
    .player-token { cursor: pointer; }
    .player-token:hover .token-circle { filter: brightness(1.2); }

    /* Focus styles */
    *:focus { outline: none; }
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Hint: scrubber -->
  <div class="hint hint-scrubber">
    <span class="hint-arrow">&#8595;</span>
    <span>Click a match period to see the team at that point</span>
  </div>

  <!-- Time Scrubber -->
  <nav class="scrubber" aria-label="Match timeline">
    <div class="scrubber-grid" id="scrubberGrid" role="tablist"></div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div class="main-grid">
      <div>
        <!-- Toggle buttons row -->
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <button class="opp-btn" id="oppBtn" style="margin-bottom:0">Show Opposition</button>
          <button class="grid-btn" id="gridBtn" style="margin-bottom:0">Show Rota Grid</button>
        </div>

        <!-- Hint: pitch -->
        <div class="hint hint-pitch" id="hintPitch">
          <span class="hint-arrow">&#8595;</span>
          <span>Click a player to see when/if they are subbing</span>
        </div>

        <!-- Bench -->
        <div class="bench-bar" id="benchBar" role="button" tabindex="0" aria-label="Bench player">
          <div class="bench-dot" id="benchDot"></div>
          <div>
            <span class="bench-label">Bench</span>
            <div class="bench-player-name" id="benchName">&mdash;</div>
          </div>
        </div>

        <!-- Pitch -->
        <div class="pitch-wrapper">
          <svg class="pitch-svg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Football pitch showing team formation">
            <defs>
              <pattern id="grass" patternUnits="userSpaceOnUse" width="400" height="40">
                <rect width="400" height="20" fill="#1a4d2e"/>
                <rect y="20" width="400" height="20" fill="#1e5a34"/>
              </pattern>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Pitch background -->
            <rect width="400" height="600" fill="url(#grass)" rx="6"/>

            <!-- Pitch markings -->
            <g stroke="rgba(255,255,255,0.55)" stroke-width="1.5" fill="none">
              <rect x="20" y="15" width="360" height="570" rx="2"/>
              <line x1="20" y1="300" x2="380" y2="300"/>
              <circle cx="200" cy="300" r="50"/>
              <circle cx="200" cy="300" r="2.5" fill="rgba(255,255,255,0.55)"/>
              <rect x="100" y="15" width="200" height="80"/>
              <rect x="150" y="15" width="100" height="30"/>
              <circle cx="200" cy="70" r="2.5" fill="rgba(255,255,255,0.55)"/>
              <path d="M 145 95 A 50 50 0 0 0 255 95"/>
              <rect x="170" y="7" width="60" height="8" rx="1" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
              <rect x="100" y="505" width="200" height="80"/>
              <rect x="150" y="555" width="100" height="30"/>
              <circle cx="200" cy="530" r="2.5" fill="rgba(255,255,255,0.55)"/>
              <path d="M 145 505 A 50 50 0 0 1 255 505"/>
              <rect x="170" y="585" width="60" height="8" rx="1" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
            </g>

            <!-- Opposition overlay tokens -->
            <g id="oppOverlay"></g>
            <!-- Our player tokens -->
            <g id="pitchTokens"></g>
          </svg>
        </div>

        <!-- Position/time grid (hidden by default) -->
        <div class="pos-grid" id="posGrid" style="display:none"></div>

      </div>

      <!-- Player Detail -->
      <div class="player-detail empty" id="playerDetail">
        Tap any player to see how their match unfolds.
      </div>
    </div>
  </main>
</div>

<script>
// ── Data ──
const players = {
  drew:   { name: "Drew",   role: "Goalkeeper",        blurb: "Goalkeeper. Plays the full 90 minutes." },
  ben:    { name: "Ben",    role: "Left Back",         blurb: "Left back. Plays the full 90 minutes." },
  elango: { name: "Elango", role: "Centre Back",       blurb: "Centre back. Plays the full 90 minutes." },
  chris:  { name: "Chris",  role: "Centre Back",       blurb: "Centre back. Plays 0\u201315, rests 15\u201330, returns from 30 onwards." },
  mark:   { name: "Mark",   role: "RB \u2192 RW",     blurb: "Right back (0\u2013HT). Rests HT\u201360. Returns at RW from 60 onwards." },
  andrew: { name: "Andrew", role: "CB \u2192 CDM",    blurb: "Starts on the bench. Comes on at CB (15\u201330), then moves to CDM from 30 onwards." },
  tim:    { name: "Tim",    role: "CDM \u2192 RB",    blurb: "Plays CDM (0\u201330). Rests 30\u2013HT. Returns at RB from half-time onwards." },
  john:   { name: "John",   role: "Right Central Mid", blurb: "Midfielder. Plays the full 90 minutes." },
  jacob:  { name: "Jacob",  role: "Attacking Mid",     blurb: "Attacking midfielder. Plays 0\u201360, rests 60\u201375, returns from 75 onwards." },
  fred:   { name: "Fred",   role: "RW \u2192 LM",     blurb: "Right wing (0\u201360). Moves to CAM (60\u201375). Rests from 75 onwards." },
  jordan: { name: "Jordan", role: "Left Wing",         blurb: "Left wing. Plays the full 90 minutes." },
  tommy:  { name: "Tommy",  role: "Striker",           blurb: "Striker. Plays the full 90 minutes." }
};

const positions = {
  gk:  { x: 200, y: 545, type: "gk",  label: "GK"  },
  lb:  { x:  60, y: 470, type: "fb",  label: "LB"  },
  cb1: { x: 155, y: 490, type: "cb",  label: "CB"  },
  cb2: { x: 245, y: 490, type: "cb",  label: "CB"  },
  rb:  { x: 340, y: 470, type: "fb",  label: "RB"  },
  dm:  { x: 200, y: 340, type: "cdm", label: "CDM" },
  rcm: { x: 255, y: 240, type: "m",   label: "M"   },
  lw:  { x:  60, y: 220, type: "wg",  label: "LW"  },
  cam: { x: 145, y: 240, type: "m",   label: "M"   },
  rw:  { x: 340, y: 220, type: "wg",  label: "RW"  },
  st:  { x: 200, y:  90, type: "st",  label: "ST"  }
};

const BENCH_POS = { x: 200, y: -40 };

const timeline = [
  { id: "fh", short: "FH", name: "Kick-off", subLabel: "0\u201315",  formation: { gk: "drew", lb: "ben", cb1: "chris",  cb2: "elango", rb: "mark",  dm: "tim",    rcm: "john", lw: "jordan", cam: "jacob", rw: "fred", st: "tommy", bench: "andrew" } },
  { id: "15", short: "15", name: "15\u2032",      subLabel: "Sub 1", formation: { gk: "drew", lb: "ben", cb1: "andrew", cb2: "elango", rb: "mark",  dm: "tim",    rcm: "john", lw: "jordan", cam: "jacob", rw: "fred", st: "tommy", bench: "chris"  } },
  { id: "30", short: "30", name: "30\u2032",      subLabel: "Sub 2", formation: { gk: "drew", lb: "ben", cb1: "chris",  cb2: "elango", rb: "mark",  dm: "andrew", rcm: "john", lw: "jordan", cam: "jacob", rw: "fred", st: "tommy", bench: "tim"    } },
  { id: "ht", short: "HT", name: "HT",       subLabel: "Sub 3", formation: { gk: "drew", lb: "ben", cb1: "chris",  cb2: "elango", rb: "tim",   dm: "andrew", rcm: "john", lw: "jordan", cam: "jacob", rw: "fred", st: "tommy", bench: "mark"   } },
  { id: "60", short: "60", name: "60\u2032",      subLabel: "Sub 4", formation: { gk: "drew", lb: "ben", cb1: "chris",  cb2: "elango", rb: "tim",   dm: "andrew", rcm: "john", lw: "jordan", cam: "fred",  rw: "mark", st: "tommy", bench: "jacob"  } },
  { id: "75", short: "75", name: "75\u2032",      subLabel: "Sub 5", formation: { gk: "drew", lb: "ben", cb1: "chris",  cb2: "elango", rb: "tim",   dm: "andrew", rcm: "john", lw: "jordan", cam: "jacob", rw: "mark", st: "tommy", bench: "fred"   } }
];

const opposition = [
  { name: "George",        pos: "gk"  },
  { name: "Brendon",          pos: "rb"  },
  { name: "Big Mac",       pos: "cb1" },
  { name: "Dredd",         pos: "cb2" },
  { name: "Donnovan",      pos: "lb"  },
  { name: "Rocky",         pos: "dm",  x: 200, y: 340 },
  { name: "Migsy",         pos: "rcm", x: 255, y: 240 },
  { name: "Adam",          pos: "lw"  },
  { name: "Reuben",        pos: "cam", x: 145, y: 240 },
  { name: "Owen",       pos: "rw"  },
  { name: "Darren / Johnnie", pos: "st" }
];

// ── Colour helpers ──
const typeColor = {
  gk:  "#f59e0b",
  cb:  "#3b82f6",
  fb:  "#06b6d4",
  cdm: "#6366f1",
  m:   "#8b5cf6",
  wg:  "#ec4899",
  st:  "#ef4444"
};

function posType(posKey) {
  if (posKey === "bench") return "bench";
  return positions[posKey]?.type || "bench";
}

// ── Compressed position helpers ──
const Y_MIN = 90, Y_MAX = 545;

function compressOurPos(pos) {
  const norm = (pos.y - Y_MIN) / (Y_MAX - Y_MIN);
  return { x: pos.x, y: 320 + norm * 250 };
}

function compressOppPos(pos) {
  const norm = (pos.y - Y_MIN) / (Y_MAX - Y_MIN);
  return { x: 400 - pos.x, y: 280 - norm * 250 };
}

function getTargetPos(posKey) {
  const pos = positions[posKey];
  return showingOpposition ? compressOurPos(pos) : pos;
}

// ── State ──
let currentPeriod = 0;
let selectedPlayer = "drew";
let showingOpposition = false;

// ── Scrubber ──
const scrubberGrid = document.getElementById("scrubberGrid");
timeline.forEach((period, i) => {
  const btn = document.createElement("button");
  btn.className = "scrubber-btn" + (i === 0 ? " active" : "");
  btn.setAttribute("role", "tab");
  btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
  btn.setAttribute("aria-label", period.name + " " + period.subLabel);
  btn.innerHTML = `<span class="time-label">${period.short}</span><span class="sub-label">${period.subLabel}</span>`;
  btn.addEventListener("click", () => selectPeriod(i));
  scrubberGrid.appendChild(btn);
});

function selectPeriod(idx) {
  if (idx === currentPeriod) return;
  currentPeriod = idx;

  scrubberGrid.querySelectorAll(".scrubber-btn").forEach((btn, i) => {
    btn.classList.toggle("active", i === idx);
    btn.setAttribute("aria-selected", i === idx ? "true" : "false");
  });

  renderPitch();
  updateBench();
  if (selectedPlayer) renderDetail(selectedPlayer);
  if (showingGrid) buildGrid();
}

// ── Pitch rendering ──
const pitchTokens = document.getElementById("pitchTokens");
const oppOverlay = document.getElementById("oppOverlay");
const SVG_NS = "http://www.w3.org/2000/svg";

function animateToken(g, fromX, fromY, toX, toY, duration, onDone) {
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    const x = fromX + (toX - fromX) * ease;
    const y = fromY + (toY - fromY) * ease;
    g.setAttribute("transform", `translate(${x}, ${y})`);
    if (t < 1) {
      requestAnimationFrame(step);
    } else if (onDone) {
      onDone();
    }
  }
  requestAnimationFrame(step);
}

function animateOpacity(g, from, to, duration, onDone) {
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    g.style.opacity = from + (to - from) * ease;
    if (t < 1) {
      requestAnimationFrame(step);
    } else if (onDone) {
      onDone();
    }
  }
  requestAnimationFrame(step);
}

function getTokenPos(g) {
  const match = (g.getAttribute("transform") || "").match(/translate\(\s*([-\d.]+)[,\s]+([-\d.]+)/);
  return match ? { x: parseFloat(match[1]), y: parseFloat(match[2]) } : { x: 0, y: 0 };
}

function renderPitch() {
  const formation = timeline[currentPeriod].formation;

  const existingTokens = {};
  pitchTokens.querySelectorAll(".player-token").forEach(g => {
    existingTokens[g.dataset.player] = g;
  });

  const newOnPitch = new Set();
  const goingOff = {};

  for (const [posKey, playerId] of Object.entries(formation)) {
    if (posKey === "bench") continue;
    newOnPitch.add(playerId);
  }

  for (const [playerId, g] of Object.entries(existingTokens)) {
    if (!newOnPitch.has(playerId)) {
      goingOff[playerId] = g;
    }
  }

  const comingOn = {};
  for (const [posKey, playerId] of Object.entries(formation)) {
    if (posKey === "bench") continue;
    if (!existingTokens[playerId]) {
      comingOn[playerId] = posKey;
    }
  }

  const hasSubstitution = Object.keys(goingOff).length > 0 || Object.keys(comingOn).length > 0;
  const SUB_OFF_DURATION = 400;
  const SUB_ON_DELAY = hasSubstitution ? 250 : 0;
  const SUB_ON_DURATION = 400;
  const MOVE_DURATION = 350;

  // 1. Players going off
  for (const [playerId, g] of Object.entries(goingOff)) {
    const cur = getTokenPos(g);
    g.style.pointerEvents = "none";
    animateToken(g, cur.x, cur.y, BENCH_POS.x, BENCH_POS.y, SUB_OFF_DURATION);
    animateOpacity(g, 1, 0, SUB_OFF_DURATION, () => g.remove());
  }

  // 2. Players staying
  for (const [posKey, playerId] of Object.entries(formation)) {
    if (posKey === "bench") continue;
    const existing = existingTokens[playerId];
    if (!existing || goingOff[playerId]) continue;

    const target = getTargetPos(posKey);
    const color = typeColor[positions[posKey].type];
    const circle = existing.querySelector(".token-circle");
    const labelText = existing.querySelector(".token-label");
    const cur = getTokenPos(existing);

    if (Math.abs(cur.x - target.x) > 1 || Math.abs(cur.y - target.y) > 1) {
      animateToken(existing, cur.x, cur.y, target.x, target.y, MOVE_DURATION);
    }
    circle.setAttribute("fill", color);
    labelText.textContent = positions[posKey].label;

    if (playerId === selectedPlayer) {
      circle.setAttribute("stroke", "#fbbf24");
      circle.setAttribute("stroke-width", "3");
      existing.setAttribute("filter", "url(#glow)");
    } else {
      circle.setAttribute("stroke", "none");
      circle.setAttribute("stroke-width", "0");
      existing.removeAttribute("filter");
    }
  }

  // 3. Players coming on
  for (const [playerId, posKey] of Object.entries(comingOn)) {
    const target = getTargetPos(posKey);
    const color = typeColor[positions[posKey].type];
    const g = createToken(playerId, positions[posKey], color, BENCH_POS.x, BENCH_POS.y);
    g.style.opacity = "0";
    pitchTokens.appendChild(g);

    setTimeout(() => {
      animateOpacity(g, 0, 1, SUB_ON_DURATION);
      animateToken(g, BENCH_POS.x, BENCH_POS.y, target.x, target.y, SUB_ON_DURATION);
    }, SUB_ON_DELAY);
  }
}

function createToken(playerId, pos, color, startX, startY) {
  const x = startX !== undefined ? startX : pos.x;
  const y = startY !== undefined ? startY : pos.y;

  const g = document.createElementNS(SVG_NS, "g");
  g.classList.add("player-token");
  g.dataset.player = playerId;
  g.setAttribute("transform", `translate(${x}, ${y})`);
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", players[playerId].name);

  const isSelected = playerId === selectedPlayer;

  const circle = document.createElementNS(SVG_NS, "circle");
  circle.classList.add("token-circle");
  circle.setAttribute("r", "22");
  circle.setAttribute("fill", color);
  if (isSelected) {
    circle.setAttribute("stroke", "#fbbf24");
    circle.setAttribute("stroke-width", "3");
    g.setAttribute("filter", "url(#glow)");
  }

  const name = document.createElementNS(SVG_NS, "text");
  name.classList.add("token-name");
  name.setAttribute("text-anchor", "middle");
  name.setAttribute("dy", "0.35em");
  name.setAttribute("fill", "#fff");
  name.setAttribute("font-size", "11");
  name.setAttribute("font-weight", "700");
  name.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
  name.textContent = players[playerId].name;

  const label = document.createElementNS(SVG_NS, "text");
  label.classList.add("token-label");
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("y", "32");
  label.setAttribute("fill", "rgba(255,255,255,0.7)");
  label.setAttribute("font-size", "9");
  label.setAttribute("font-weight", "600");
  label.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
  label.textContent = pos.label;

  g.appendChild(circle);
  g.appendChild(name);
  g.appendChild(label);

  g.addEventListener("click", () => selectPlayer(playerId));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectPlayer(playerId); } });

  return g;
}

// ── Bench ──
const benchBar = document.getElementById("benchBar");
const benchName = document.getElementById("benchName");
const benchDot = document.getElementById("benchDot");

function getBenchColor(playerId) {
  for (let i = currentPeriod; i >= 0; i--) {
    for (const [posKey, pid] of Object.entries(timeline[i].formation)) {
      if (pid === playerId && posKey !== "bench") {
        return typeColor[positions[posKey].type];
      }
    }
  }
  for (let i = currentPeriod + 1; i < timeline.length; i++) {
    for (const [posKey, pid] of Object.entries(timeline[i].formation)) {
      if (pid === playerId && posKey !== "bench") {
        return typeColor[positions[posKey].type];
      }
    }
  }
  return "#475569";
}

function updateBench() {
  const benchPlayerId = timeline[currentPeriod].formation.bench;
  benchName.textContent = players[benchPlayerId].name;
  benchDot.textContent = players[benchPlayerId].name;
  benchDot.style.background = getBenchColor(benchPlayerId);
  benchBar.classList.toggle("selected", benchPlayerId === selectedPlayer);
}

benchBar.addEventListener("click", () => {
  selectPlayer(timeline[currentPeriod].formation.bench);
});
benchBar.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectPlayer(timeline[currentPeriod].formation.bench); }
});

// ── Player selection ──
function selectPlayer(playerId) {
  selectedPlayer = playerId;
  renderDetail(playerId);
  updateTokenSelection();
  updateBench();

  if (window.innerWidth < 768) {
    document.getElementById("playerDetail").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function updateTokenSelection() {
  pitchTokens.querySelectorAll(".player-token").forEach(g => {
    const circle = g.querySelector(".token-circle");
    if (g.dataset.player === selectedPlayer) {
      circle.setAttribute("stroke", "#fbbf24");
      circle.setAttribute("stroke-width", "3");
      g.setAttribute("filter", "url(#glow)");
    } else {
      circle.setAttribute("stroke", "none");
      circle.setAttribute("stroke-width", "0");
      g.removeAttribute("filter");
    }
  });
}

// ── Detail panel ──
const playerDetail = document.getElementById("playerDetail");

function renderDetail(playerId) {
  const p = players[playerId];
  playerDetail.classList.remove("empty");

  const journeySegments = timeline.map((period) => {
    for (const [posKey, pid] of Object.entries(period.formation)) {
      if (pid === playerId) {
        const type = posType(posKey);
        const label = posKey === "bench" ? "BENCH" : positions[posKey].label;
        return { type, label };
      }
    }
    return { type: "bench", label: "BENCH" };
  });

  const segHTML = journeySegments.map((s, i) =>
    `<div class="journey-seg type-${s.type}${i === currentPeriod ? ' active' : ''}" data-period="${i}">${s.label}</div>`
  ).join("");

  const labelHTML = timeline.map(t => `<span>${t.short}</span>`).join("");

  playerDetail.innerHTML = `
    <div class="player-name-big">${p.name}</div>
    <div class="player-role">${p.role}</div>
    <div class="journey-bar">
      <div class="journey-bar-label">Match Journey</div>
      <div class="journey-segments">${segHTML}</div>
      <div class="journey-labels">${labelHTML}</div>
    </div>
    <div class="player-blurb">${p.blurb}</div>
  `;

  // Make journey segments clickable
  playerDetail.querySelectorAll(".journey-seg").forEach(seg => {
    seg.addEventListener("click", () => {
      const idx = parseInt(seg.dataset.period);
      if (idx !== currentPeriod) {
        selectPeriod(idx);
      }
    });
  });
}

// ── Opposition overlay ──
const oppBtn = document.getElementById("oppBtn");

function toggleOpposition() {
  showingOpposition = !showingOpposition;
  oppBtn.textContent = showingOpposition ? "Hide Opposition" : "Show Opposition";
  oppBtn.classList.toggle("active", showingOpposition);

  const ANIM = 500;

  if (showingOpposition) {
    // Compress our team into bottom half
    const formation = timeline[currentPeriod].formation;
    pitchTokens.querySelectorAll(".player-token").forEach(g => {
      const playerId = g.dataset.player;
      // Find this player's position key
      for (const [posKey, pid] of Object.entries(formation)) {
        if (pid === playerId && posKey !== "bench") {
          const target = compressOurPos(positions[posKey]);
          const cur = getTokenPos(g);
          animateToken(g, cur.x, cur.y, target.x, target.y, ANIM);
          break;
        }
      }
    });

    // Show opposition in top half
    opposition.forEach(opp => {
      const pos = positions[opp.pos];
      const basePos = (opp.x !== undefined) ? { x: opp.x, y: opp.y } : pos;
      const target = compressOppPos(basePos);
      const color = typeColor[pos.type];

      const g = document.createElementNS(SVG_NS, "g");
      g.classList.add("opp-token");
      g.setAttribute("transform", `translate(${target.x}, ${target.y})`);
      g.style.opacity = "0";

      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("r", "20");
      circle.setAttribute("fill", color);
      circle.setAttribute("opacity", "0.7");
      circle.setAttribute("stroke", "rgba(255,255,255,0.3)");
      circle.setAttribute("stroke-width", "1.5");

      const name = document.createElementNS(SVG_NS, "text");
      name.setAttribute("text-anchor", "middle");
      name.setAttribute("dy", "0.35em");
      name.setAttribute("fill", "#fff");
      name.setAttribute("font-size", opp.name.length > 8 ? "8" : "10");
      name.setAttribute("font-weight", "600");
      name.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
      name.textContent = opp.name;

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("y", "30");
      label.setAttribute("fill", "rgba(255,255,255,0.5)");
      label.setAttribute("font-size", "8");
      label.setAttribute("font-weight", "600");
      label.setAttribute("font-family", "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
      label.textContent = pos.label;

      g.appendChild(circle);
      g.appendChild(name);
      g.appendChild(label);
      oppOverlay.appendChild(g);

      // Stagger fade-in
      setTimeout(() => {
        animateOpacity(g, 0, 1, 350);
      }, 150);
    });
  } else {
    // Fade out opposition
    oppOverlay.querySelectorAll(".opp-token").forEach(g => {
      animateOpacity(g, 1, 0, 300, () => g.remove());
    });

    // Expand our team back to full pitch
    const formation = timeline[currentPeriod].formation;
    pitchTokens.querySelectorAll(".player-token").forEach(g => {
      const playerId = g.dataset.player;
      for (const [posKey, pid] of Object.entries(formation)) {
        if (pid === playerId && posKey !== "bench") {
          const target = positions[posKey];
          const cur = getTokenPos(g);
          animateToken(g, cur.x, cur.y, target.x, target.y, ANIM);
          break;
        }
      }
    });
  }
}

oppBtn.addEventListener("click", toggleOpposition);

// ── Position/time grid ──
const gridBtn = document.getElementById("gridBtn");
const posGrid = document.getElementById("posGrid");
const pitchWrapper = document.querySelector(".pitch-wrapper");
const hintPitch = document.getElementById("hintPitch");
let showingGrid = false;

const posOrder = ["gk","lb","cb1","cb2","rb","dm","rcm","cam","lw","rw","st","bench"];

function buildGrid() {
  const rows = posOrder.map(posKey => {
    const label = posKey === "bench" ? "Bench" : positions[posKey].label;
    const type = posKey === "bench" ? "bench" : positions[posKey].type;
    const color = posKey === "bench" ? "#475569" : typeColor[type];

    const cells = timeline.map((period, i) => {
      const playerId = period.formation[posKey];
      const prevPlayerId = i > 0 ? timeline[i - 1].formation[posKey] : null;
      const changed = prevPlayerId !== null && prevPlayerId !== playerId;
      const name = players[playerId].name;
      const isActive = i === currentPeriod;
      const changeBorder = changed ? 'box-shadow:inset 0 0 0 2px #fbbf24;' : '';
      return `<td class="filled" style="background:${color}${isActive ? '' : '99'};${isActive ? 'outline:2px solid var(--gold);outline-offset:-2px;' : ''}${changeBorder}" data-period="${i}" data-player="${playerId}">${name}</td>`;
    }).join("");

    return `<tr><th class="row-header" style="border-left:3px solid ${color}">${label}</th>${cells}</tr>`;
  }).join("");

  const headerCells = timeline.map((t, i) =>
    `<th${i === currentPeriod ? ' style="color:var(--gold)"' : ''}>${t.short}</th>`
  ).join("");

  posGrid.innerHTML = `<table><thead><tr><th class="row-header"></th>${headerCells}</tr></thead><tbody>${rows}</tbody></table>`;

  // Make cells clickable
  posGrid.querySelectorAll("td[data-period]").forEach(td => {
    td.style.cursor = "pointer";
    td.addEventListener("click", () => {
      const idx = parseInt(td.dataset.period);
      const pid = td.dataset.player;
      if (idx !== currentPeriod) selectPeriod(idx);
      selectPlayer(pid);
      buildGrid(); // refresh highlight
    });
  });
}

function toggleGrid() {
  showingGrid = !showingGrid;
  gridBtn.textContent = showingGrid ? "Show Pitch" : "Show Rota Grid";
  gridBtn.classList.toggle("active", showingGrid);

  if (showingGrid) {
    // Turn off opposition if on
    if (showingOpposition) toggleOpposition();
    oppBtn.style.display = "none";
    pitchWrapper.style.display = "none";
    benchBar.style.display = "none";
    hintPitch.style.display = "none";
    posGrid.style.display = "block";
    buildGrid();
  } else {
    oppBtn.style.display = "block";
    pitchWrapper.style.display = "block";
    benchBar.style.display = "flex";
    hintPitch.style.display = "flex";
    posGrid.style.display = "none";
  }
}

gridBtn.addEventListener("click", toggleGrid);

// ── Initial render ──
function initialRender() {
  const formation = timeline[0].formation;
  for (const [posKey, playerId] of Object.entries(formation)) {
    if (posKey === "bench") continue;
    const pos = positions[posKey];
    const color = typeColor[pos.type];
    const g = createToken(playerId, pos, color);
    pitchTokens.appendChild(g);
  }
  updateBench();
}

initialRender();
renderDetail("drew");
</script>
